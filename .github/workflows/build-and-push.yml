name: Build, Push to ECR, and Deploy to EKS

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: assignment-app
  EKS_CLUSTER_NAME: assignment-dev
  EKS_NAMESPACE: assignment-app
  HELM_RELEASE: assignment-app

permissions:
  id-token: write
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # AWS AUTH USING OIDC (NO SECRET KEYS)
      # ----------------------------------------------------
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::821106082324:role/GitHubActionsRole
          role-session-name: GitHubActionsDeployment
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------
      # LOGIN TO ECR
      # ----------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------
      # BUILD & PUSH DOCKER IMAGE
      # ----------------------------------------------------
      - name: Build & Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_TAG=v1
          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          echo "Pushing Docker image..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      # ----------------------------------------------------
      # INSTALL kubectl AND HELM
      # ----------------------------------------------------
      - name: Install kubectl
        run: |
          curl -o kubectl https://amazon-eks.s3.us-west-2.amazonaws.com/1.29.0/2024-01-04/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # ----------------------------------------------------
      # CONNECT TO EKS CLUSTER
      # ----------------------------------------------------
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

      - name: Verify Kubernetes Access
        run: kubectl get nodes

      # ----------------------------------------------------
      # NEW STAGE: BUILD HELM DEPENDENCIES
      # REQUIRED FOR APPLICATION-HELM DEPENDENCY
      # ----------------------------------------------------
      - name: Build Helm Dependencies
        run: |
          echo "Building Helm dependencies..."
          helm dependency build ./helm
          echo "Dependency build completed."

      # ----------------------------------------------------
      # DEPLOY USING HELM
      # ----------------------------------------------------
      - name: Deploy to EKS
        run: |
          helm upgrade --install $HELM_RELEASE ./helm \
            --namespace $EKS_NAMESPACE \
            --create-namespace \
            --set application-helm.deployment.image.repository=$(echo $IMAGE_URI | cut -d: -f1) \
            --set application-helm.deployment.image.tag=$(echo $IMAGE_URI | cut -d: -f2)

      - name: Check Deployment Status
        run: |
          kubectl rollout status deployment/$HELM_RELEASE -n $EKS_NAMESPACE